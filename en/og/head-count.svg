<rect width="1200" height="630" fill="#f7f7fb"/>
<rect x="0" y="0" width="1200" height="6" fill="oklch(54.1% 0.19 141.6)"/>

<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="72" y="64" width="40" height="40" rx="11" fill="oklch(54.1% 0.19 141.6)"/>
