  <text x="72" y="230" dominant-baseline="central" font-size="68" font-weight="680" letter-spacing="-1.4" fill="#14161f">Number pyramid</text>

  <text x="72" y="326" dominant-baseline="central" font-size="29" fill="#5c6070">Every cell is the sum of the two below</text>
  <text x="72" y="366" dominant-baseline="central" font-size="29" fill="#5c6070">it.</text>

