  <text x="72" y="326" dominant-baseline="central" font-size="29" fill="#5c6070">印に上下がある六つの正方形。折ると、どの立方体になるでしょう？</text>

  <line x1="72" y1="526" x2="520" y2="526" stroke="#dcdce8" stroke-width="2"/>
  <text x="72" y="564" dominant-baseline="central" font-size="23" fill="#83879a">練習であって検査ではありません。IQスコアは一切出しません。</text>
</g>

