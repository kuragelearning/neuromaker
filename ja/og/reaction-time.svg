<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="反応時間" data-og-type="reaction-time">
<defs><pattern id="p-dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.3" fill="#14161f" fill-opacity="0.95"/></pattern><pattern id="p-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><line x1="0" y1="8" x2="8" y2="0" stroke="#14161f" stroke-opacity="0.95" stroke-width="1.6" stroke-linecap="round"/></pattern><pattern id="p-cross" width="8" height="8" patternUnits="userSpaceOnUse"><line x1="0" y1="8" x2="8" y2="0" stroke="#14161f" stroke-opacity="0.95" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="8" y2="8" stroke="#14161f" stroke-opacity="0.95" stroke-width="1.5" stroke-linecap="round"/></pattern><pattern id="p-dense" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><line x1="0" y1="4.5" x2="4.5" y2="0" stroke="#14161f" stroke-opacity="0.95" stroke-width="1.7" stroke-linecap="round"/></pattern></defs>
<rect width="1200" height="630" fill="#f7f7fb"/>
<rect x="0" y="0" width="1200" height="6" fill="oklch(54.1% 0.19 184.4)"/>

<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="72" y="64" width="40" height="40" rx="11" fill="oklch(54.1% 0.19 184.4)"/>
  <text x="92" y="84" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#ffffff">▦</text>
  <text x="126" y="84" dominant-baseline="central" font-size="27" font-weight="700" fill="#14161f">ニューロンを鍛えよう</text>

  <text x="72" y="168" font-size="21" font-weight="650" letter-spacing="2.4" fill="oklch(54.1% 0.19 184.4)">反応・判断速度 (Gt)</text>

  <text x="72" y="230" dominant-baseline="central" font-size="68" font-weight="680" letter-spacing="-1.4" fill="#14161f">反応時間</text>

  <text x="72" y="326" dominant-baseline="central" font-size="29" fill="#5c6070">合図を待って、光った目標を押しましょう。五回。</text>

  <line x1="72" y1="526" x2="520" y2="526" stroke="#dcdce8" stroke-width="2"/>
  <text x="72" y="564" dominant-baseline="central" font-size="23" fill="#83879a">練習であって検査ではありません。IQスコアは一切出しません。</text>
</g>

<g data-og-stage="" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><circle cx="756" cy="315" r="48" fill="#5b53e8"/><circle cx="756" cy="315" r="58" fill="none" stroke="#5b53e8" stroke-width="4" stroke-opacity="0.4"/><circle cx="880" cy="315" r="48" fill="#eeeef5" stroke="#dcdce8" stroke-width="3"/><circle cx="1004" cy="315" r="48" fill="#eeeef5" stroke="#dcdce8" stroke-width="3"/></g>
</svg>
